<!doctype html>
<html lang="en" class="palette-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kairo command palette</title>
    <script>
      try {
        const t = localStorage.getItem("kairo.theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <script type="module" src="/src/palette.ts" defer></script>
  </head>
  <body class="palette-page">
    <section class="palette" id="palette" aria-label="Command palette">
      <div class="palette-search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
        <input
          type="text"
          id="palette-input"
          role="combobox"
          aria-expanded="true"
          aria-controls="palette-results"
          aria-autocomplete="list"
          aria-label="Search Kairo"
          placeholder="Open an app, jump to a day, or type a command"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd>Esc</kbd>
      </div>
      <div class="palette-preview" id="palette-preview" hidden></div>
      <div class="palette-results" id="palette-results" role="listbox" aria-label="Results"></div>
      <footer class="palette-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> Move</span>
        <span><kbd>Enter</kbd> Run</span>
        <span class="palette-today" id="palette-today"></span>
      </footer>
    </section>
  </body>
</html>
