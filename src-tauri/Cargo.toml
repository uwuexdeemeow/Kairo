[package]
name = "kairo"
version = "1.19.1"
description = "Local-first screen time tracker that explains your focus patterns"
edition = "2021"

[lib]
name = "kairo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api lets the command palette's window be see-through on a Mac.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
# File pickers for exporting, backing up and restoring.
tauri-plugin-dialog = "2"
tiny_http = "0.12"
png = "0.18"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rrule = "0.14.0"

# Window, idle and icon queries on a Mac; the same versions Tauri already builds there.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "NSBitmapImageRep",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSWindow",
  "NSWorkspace",
  "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }

# The window in front and idle time on Linux, from X11 or GNOME; the versions global shortcuts
# and single-instance already build.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
libc = "0.2"
x11rb = { version = "0.13", features = ["screensaver"] }
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_WindowsAndMessaging",
] }
# The command palette draws itself with Direct2D and DirectWrite, and browsers' address bars are
# read with UI Automation, all COM APIs; the same versions Tauri already builds.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"
