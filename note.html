<!doctype html>
<html lang="en" data-app="ledger">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note</title>
    <!-- The theme used last time, before anything draws, so a light setup never flashes dark. -->
    <script>
      try {
        const t = localStorage.getItem("kairo.theme");
        if (t) document.documentElement.dataset.theme = t;
        const g = localStorage.getItem("kairo.ground");
        if (g) document.documentElement.dataset.ground = g;
      } catch {}
    </script>
    <script type="module" src="/src/note-window.ts" defer></script>
  </head>
  <body class="popout-page">
    <main id="popout"></main>
  </body>
</html>
