<!doctype html>
<html lang="en" data-app="ledger">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger</title>
    <!-- The theme used last time, before anything draws, so a light setup never flashes dark. -->
    <script>
      try {
        const t = localStorage.getItem("kairo.theme");
        if (t) document.documentElement.dataset.theme = t;
        const g = localStorage.getItem("kairo.ground");
        if (g) document.documentElement.dataset.ground = g;
      } catch {}
    </script>
    <script type="module" src="/src/ledger.ts" defer></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <button class="back-to-kairo" id="back-to-kairo">← Kairo</button>
        <span class="wordmark">ledger</span>
        <nav class="tabs" role="tablist" aria-label="Main" aria-orientation="vertical">
          <button role="tab" data-view="tasks" id="tab-tasks" aria-selected="true" aria-controls="view-tasks" title="Tasks (Ctrl+1)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" /><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2" /></svg>
            Tasks <b class="nav-count" id="count-tasks"></b>
          </button>
          <button role="tab" data-view="calendar" id="tab-calendar" aria-selected="false" aria-controls="view-calendar" title="Calendar (Ctrl+2)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" /><path d="M4 10h16M9 3v4M15 3v4" /></svg>
            Calendar
          </button>
          <button role="tab" data-view="notes" id="tab-notes" aria-selected="false" aria-controls="view-notes" title="Notes (Ctrl+3)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z" /><path d="M14 3v5h5M9 12h7M9 16h5" /></svg>
            Notes <b class="nav-count" id="count-notes"></b>
          </button>
          <button role="tab" data-view="done" id="tab-done" aria-selected="false" aria-controls="view-done" title="Done (Ctrl+4)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M8 12.5l2.7 2.7L16 9.5" /></svg>
            Done
          </button>
          <button role="tab" data-view="plan" id="tab-plan" aria-selected="false" aria-controls="view-plan" title="Plan the day (Ctrl+5)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M7 18a5 5 0 0110 0M12 6V3M5.5 9.5L4 8M18.5 9.5L20 8" /></svg>
            Plan
          </button>
          <button role="tab" data-view="settings" id="tab-settings" aria-selected="false" aria-controls="view-settings" class="tab-settings" title="Settings (Ctrl+6)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" /><circle cx="16" cy="6" r="2" /><circle cx="10" cy="12" r="2" /><circle cx="18" cy="18" r="2" /></svg>
            Settings
          </button>
        </nav>
      </aside>
      <main class="wrap ledger">
        <section class="page-head">
          <div>
            <h1 id="ledger-title">Tasks</h1>
            <p class="ledger-summary muted" id="ledger-summary"></p>
          </div>
          <!-- Beside the title, out of the list's way; Tasks only. -->
          <label class="task-find" id="task-find">
            <span class="sr-only">Find a task</span>
            <input type="search" class="filter" id="task-search" placeholder="Find a task (/)" autocomplete="off" />
          </label>
        </section>

        <!-- Above the views, so a delete from Tasks or Done shows its Undo in either. -->
        <p id="task-undo" class="task-undo" role="status" hidden></p>

        <section id="view-tasks" class="view ledger-tasks" role="tabpanel" aria-labelledby="tab-tasks">
          <p id="task-status" class="task-status" role="status"></p>
          <!-- A tag or project to narrow the list to; hidden while no task has either. -->
          <div class="label-filters" role="group" aria-label="Narrow to a project or tag" hidden></div>
          <div id="task-list" class="ledger-list"></div>
          <section id="task-detail" class="ledger-detail" hidden aria-label="Task details"></section>
        </section>

        <section id="view-calendar" class="view ledger-calendar" role="tabpanel" aria-labelledby="tab-calendar" hidden>
          <div class="label-filters" role="group" aria-label="Narrow to a project or tag" hidden></div>
          <div id="calendar-body"></div>
        </section>

        <section id="view-notes" class="view" role="tabpanel" aria-labelledby="tab-notes" hidden></section>

        <section id="view-done" class="view ledger-done" role="tabpanel" aria-labelledby="tab-done" hidden></section>

        <section id="view-plan" class="view ledger-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></section>

        <section id="view-settings" class="view" role="tabpanel" aria-labelledby="tab-settings" hidden>
          <section class="block">
            <h2>Reminders</h2>
            <label class="toggle">
              <input type="checkbox" id="ledger-reminders" />
              Remind me of tasks
            </label>
            <p class="muted">On a task's due day, once more the morning after if it's still open, and at its own reminder time. Only while you're at the computer; with computers combined, just one of them reminds you.</p>
            <div class="row-buttons">
              <label class="field">
                Morning reminder at
                <input type="time" id="ledger-morning" value="09:00" />
              </label>
              <span class="muted" id="ledger-settings-note" aria-live="polite"></span>
            </div>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
