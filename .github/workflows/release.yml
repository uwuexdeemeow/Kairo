# Push a tag like v0.2.0 to build, sign and publish a release. Installed copies of Kairo pick it
# up through latest.json, which tauri-action uploads alongside the installers.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match version $version in tauri.conf.json"
          }

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kairo ${{ github.ref_name }}
          releaseBody: Installed copies of Kairo update to this version on their own.
          releaseDraft: false

  # After Windows, so the two jobs don't both create the release or overwrite each other's
  # entries in latest.json.
  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # One app for both kinds of Mac: Apple silicon and Intel.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Ad-hoc signed (tauri.conf.json); the update itself is signed with the updater key.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kairo ${{ github.ref_name }}
          releaseBody: Installed copies of Kairo update to this version on their own.
          releaseDraft: false
          args: --target universal-apple-darwin --bundles app,dmg

  # Last, for the same reason; it still runs if the Mac build fails, since Windows made the
  # release. Copies installed from the AppImage or the .deb (with a password prompt) update
  # themselves.
  linux:
    needs: [windows, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    # The oldest supported Ubuntu, so the AppImage runs on distributions as old as it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kairo ${{ github.ref_name }}
          releaseBody: Installed copies of Kairo update to this version on their own.
          releaseDraft: false
          args: --bundles appimage,deb
