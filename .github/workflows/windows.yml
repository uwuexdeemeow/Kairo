# Tests Kairo on Windows, which proves the Windows-only code compiles and its tests pass, then
# builds an unsigned installer, kept with the run for 14 days, for trying a build on a PC without
# making a release (which every installed copy would update to). The release workflow makes the
# signed installers.
name: Windows tests

on:
  push:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Test the web code
        run: npm test

      # Without updater files, which need the release signing key (tauri.test-build.conf.json).
      - name: Build an installer to try
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.test-build.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: kairo-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
